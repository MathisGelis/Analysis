# Integration continue : verifie chaque pull request et chaque poussee sur la branche principale.
#   api     : compilation TypeScript + tests Jest (base SQLite en memoire)
#   parser  : tests du parseur de feuilles de match FMI (Python)
#   web     : compilation TypeScript + tests Vitest
#   e2e     : parcours Playwright, avec sa propre API et son propre front (ports 4100 / 3100)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RACINE: foot-analytics-fullstack

jobs:
  api:
    name: API (tsc + Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.RACINE }}/foot-analytics-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.RACINE }}/foot-analytics-api/package-lock.json
      - run: npm ci
      - name: Compilation TypeScript
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx jest --ci

  parser:
    name: Parseur FMI (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ env.RACINE }}/foot-analytics-api/parser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ env.RACINE }}/foot-analytics-api/parser/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest tests

  web:
    name: Front (tsc + Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.RACINE }}/foot-analytics-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ env.RACINE }}/foot-analytics-web/package-lock.json
      - run: npm ci
      - name: Compilation TypeScript
        run: npx tsc --noEmit -p .
      - name: Tests
        run: npx vitest run

  e2e:
    name: Parcours de bout en bout (Playwright)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ env.RACINE }}/foot-analytics-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ${{ env.RACINE }}/foot-analytics-api/package-lock.json
            ${{ env.RACINE }}/foot-analytics-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Le parcours d'import FMI lit un vrai PDF : il lui faut pdfplumber.
      - run: pip install -r ../foot-analytics-api/parser/requirements.txt
      - run: npm ci --prefix ../foot-analytics-api
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Parcours
        run: npx playwright test
        env:
          PYTHON_BIN: python
      - name: Traces en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: ${{ env.RACINE }}/foot-analytics-web/test-results
          retention-days: 7
